model:
  clip_model_name: "ViT-B-32"     # swap to "ViT-L-14" if compute allows
  clip_pretrained: "openai"       # public, open-source weights
  unfreeze_last_n_blocks: 0       # 0 = frozen backbone, linear-probe style

data:
  # Real training data: WildFake (train/val/test splits) via Ngiam's
  # scripts/fetch_dataset.py. SID_Set lives in this same manifest under
  # split="heldout" and is NEVER read here -- ManifestDataset only loads
  # "train"/"val" (see src/train.py), so it stays untouched by construction
  # for use as the unseen-generator eval condition in evaluate.py.
  manifest_csv: "manifest/manifest.csv"
  image_size: 224
  apply_train_aug: true

train:
  batch_size: 32
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  ckpt_dir: "checkpoints"
  # RESULT (documented, not reverted blindly): tried freq_lr_multiplier=5.0
  # to fix the frequency branch's near-zero ablation contribution (see
  # scripts/check_frequency_branch.py). It worked in the narrow sense that
  # the branch stopped being inert -- the unseen_generator ablation delta
  # went from +0.0044 (v1, no boost) to -0.0071 (v2, 5x boost) -- but the
  # sign is negative: zeroing the frequency branch now IMPROVES
  # unseen-generator AUC, i.e. the extra learning capacity went toward
  # WildFake-specific frequency artifacts that hurt cross-generator
  # transfer, not toward anything that generalizes. In-domain contribution
  # stayed ~0 either way (-0.0010 boosted vs +0.0002 unboosted). Headline
  # robustness-table AUCs were ~identical between v1/v2 since CLIP alone is
  # already near-ceiling on this data, so the table alone won't show this --
  # only the ablation delta does.
  #
  # Conclusion: undertraining was NOT the (whole) explanation for the
  # frequency branch's low contribution; more capacity just found a
  # non-transferable signal. Reverted to 1.0 (no boost) as the safer
  # checkpoint. v2 kept at checkpoints/best_v2_freq_lr5x_negative_result.pt
  # for reference / the write-up; v1 is checkpoints/best.pt (the one
  # in active use).
  freq_lr_multiplier: 1.0
