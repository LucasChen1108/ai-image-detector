model:
  clip_model_name: "ViT-B-32"     # swap to "ViT-L-14" if compute allows
  clip_pretrained: "openai"       # public, open-source weights
  unfreeze_last_n_blocks: 0       # 0 = frozen backbone, linear-probe style

data:
  # Real training data: WildFake (train/val/test splits) via Ngiam's
  # scripts/fetch_dataset.py. SID_Set lives in this same manifest under
  # split="heldout" and is NEVER read here -- ManifestDataset only loads
  # "train"/"val" (see src/train.py), so it stays untouched by construction
  # for use as the unseen-generator eval condition in evaluate.py.
  manifest_csv: "manifest/manifest.csv"
  image_size: 224
  apply_train_aug: true

train:
  batch_size: 32
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  ckpt_dir: "checkpoints"
  # scripts/check_frequency_branch.py's gradient check found the frequency
  # branch's gradients running ~65x smaller than the semantic head's under a
  # shared LR, and the resulting checkpoint showed a near-zero ablation
  # delta (frequency branch not meaningfully contributing). Give it its own
  # higher LR so it can catch up within the same epoch budget. 5x is a
  # starting point, not a tuned value -- if the branch is still not moving
  # the ablation delta after a retrain, try 10x before touching architecture.
  freq_lr_multiplier: 5.0
