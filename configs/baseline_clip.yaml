model:
  clip_model_name: "ViT-B-32"     # Use ViT-L-14 if the available compute allows it.
  clip_pretrained: "openai"       # These weights are public and open source.
  unfreeze_last_n_blocks: 0       # Zero keeps the backbone frozen.

data:
  # Train on the WildFake train, validation, and test splits created by
  # scripts/fetch_dataset.py. SID_Set is in the same manifest with
  # split="heldout", but ManifestDataset only loads "train" and "val" here,
  # so the held-out generator stays untouched for evaluate.py.
  manifest_csv: "manifest/manifest.csv"
  image_size: 224
  apply_train_aug: true

train:
  batch_size: 32
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  ckpt_dir: "checkpoints"
  # We tried freq_lr_multiplier=5.0 to address the frequency branch's
  # near-zero ablation contribution; see scripts/check_frequency_branch.py.
  # The branch did start learning, but the unseen_generator ablation delta
  # moved from +0.0044 without the boost to -0.0071 with the 5x boost. Since
  # zeroing the branch now improves unseen-generator AUC, the extra capacity
  # seems to have learned WildFake-specific frequency artifacts that hurt
  # cross-generator transfer instead of learning a signal that generalizes.
  # The in-domain contribution stayed close to zero (-0.0010 boosted versus
  # +0.0002 unboosted), and the headline robustness AUCs were nearly the same
  # because CLIP was already close to its ceiling on this data. The ablation
  # delta is what exposes the difference.
  #
  # More capacity didn't solve the frequency branch's low contribution, so
  # we returned to 1.0 as the safer setting. We kept v2 at
  # checkpoints/best_v2_freq_lr5x_negative_result.pt for reference, while
  # checkpoints/best.pt remains the active v1 checkpoint.
  freq_lr_multiplier: 1.0
